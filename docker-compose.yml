version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: erp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-erpnuevo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-erpnuevo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: erp_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: ./backend
    container_name: erp_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-erpnuevo}
      - REDIS_URL=redis://cache:6379/0
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: erp_frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}
      - BACKEND_URL=http://backend:8000 # Para rewrites locales de Next
    ports:
      - "3000:3000"

  # El Cloudflare Tunnel que conecta la red de Docker con internet sin abrir puertos
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: erp_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
  redis_data:
